# Mesh lab: v1 of hello. Renamed from `hello` because a Deployment's selector
# can't change in place; Config Sync prunes the old `hello` and creates this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-v1
  namespace: config-sync-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
      version: v1
  template:
    metadata:
      labels:
        app: hello
        version: v1
    spec:
      containers:
        - name: hello
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:1.0
          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-settings
                  key: message
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
