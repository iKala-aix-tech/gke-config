# Mesh lab: v2 of hello (the canary). Same `app: hello`, different `version`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-v2
  namespace: config-sync-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
      version: v2
  template:
    metadata:
      labels:
        app: hello
        version: v2
    spec:
      containers:
        - name: hello
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:2.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
