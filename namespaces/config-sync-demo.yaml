# A namespace owned by Config Sync (NOT by Terraform).
# Rule: one object has one owner. Terraform owns `dev`; Config Sync owns this.
apiVersion: v1
kind: Namespace
metadata:
  name: config-sync-demo
  labels:
    managed-by: config-sync
    istio-injection: enabled   # Cloud Service Mesh adds the Envoy sidecar to new pods
